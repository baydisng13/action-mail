# E2E overlay: adds a GreenMail test mail server and the Playwright runner.
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml --env-file e2e/e2e.env up -d --build
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml --env-file e2e/e2e.env run --rm playwright
services:
  greenmail:
    image: greenmail/standalone:2.1.2
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users.login=email
        -Dgreenmail.auth.disabled
        -Dgreenmail.verbose=false
    expose:
      - "3025"
      - "3143"

  api:
    depends_on:
      greenmail: { condition: service_started }

  playwright:
    image: mcr.microsoft.com/playwright:v1.49.1-noble
    profiles: ["e2e"]
    working_dir: /e2e
    environment:
      WEB_URL: http://web.ps.test:3000
      API_URL: http://api.ps.test:3000
      CI: "1"
    volumes:
      - ./e2e:/e2e
    depends_on:
      web: { condition: service_started }
    command: ["sh", "-c", "npm install --no-audit --no-fund --silent && npx playwright test --reporter=list"]

